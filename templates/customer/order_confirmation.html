{% extends 'base.html' %}{% block content %}<div class="empty-state"><div class="success-icon">✓</div><span class="eyebrow">ORDER RECEIVED</span><h1>Thanks, {{ order.customer_name }}!</h1><p>Your order has been sent to the Baba Ice Cream cashier.</p><div class="order-number">{{ order.order_number }}</div><p>Status: <strong>{{ order.status }}</strong></p><p>Total: <strong class="price">{{ order.total|money }}</strong></p><a class="btn btn-brand" href="{{ url_for('order_status') }}">Track order</a><a class="btn btn-outline-success ms-2" href="{{ url_for('products') }}">Order more</a></div>{% endblock %}
